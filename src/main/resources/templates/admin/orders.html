<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('Đơn hàng')}"></head>
  <body>
    <header th:replace="~{fragments/layout :: nav}"></header>
    <main id="main">
      <nav th:replace="~{admin/nav :: nav}"></nav>
      <p class="eyebrow">Đồng hành cùng từng đơn sách</p>
      <h1>Những hành trình sắp tới.</h1>
      <form class="inline" th:action="@{/admin/orders}" method="get">
        <div>
          <label for="status">Trạng thái</label
          ><select id="status" name="status">
            <option value="">Tất cả</option>
            <option
              th:each="s:${statuses}"
              th:value="${s}"
              th:text="${s.label}"
              th:selected="${s==selectedStatus}"
            ></option>
          </select>
        </div>
        <button>Lọc đơn</button>
      </form>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Mã đơn</th>
              <th>Người nhận</th>
              <th>Ngày đặt</th>
              <th>Tổng tiền</th>
              <th>Trạng thái</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="o:${orders.content}">
              <td>
                <a
                  th:href="@{/admin/orders/{id}(id=${o.id})}"
                  th:text="${o.reference}"
                ></a>
              </td>
              <td th:text="${o.recipientName}"></td>
              <td th:text="${@present.date(o.createdAt)}"></td>
              <td th:text="${@present.money(o.totalVnd)}"></td>
              <td th:text="${o.status.label}"></td>
            </tr>
          </tbody>
        </table>
      </div>
      <p th:if="${orders.empty}" class="empty">
        Chưa có đơn hàng ở trạng thái này.
      </p>
      <nav class="pagination" aria-label="Phân trang">
        <a
          th:if="${orders.hasPrevious()}"
          th:href="@{/admin/orders(status=${selectedStatus},page=${orders.number-1})}"
          >← Trang trước</a
        ><span th:text="${orders.number+1}"></span
        ><a
          th:if="${orders.hasNext()}"
          th:href="@{/admin/orders(status=${selectedStatus},page=${orders.number+1})}"
          >Trang sau →</a
        >
      </nav>
    </main>
  </body>
</html>
