name: chapter
services:
  db:
    image: postgres:18.7
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chapter}
      POSTGRES_USER: ${POSTGRES_USER:-chapter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      # PostgreSQL 18 uses version-specific PGDATA beneath this mount.
      - chapter_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
volumes:
  chapter_postgres:
